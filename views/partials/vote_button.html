<form hx-post="/requests/{{.Request.ID}}/vote" hx-target="this" hx-swap="outerHTML">
    <button type="submit" class="flex flex-col items-center p-3 rounded-lg {{if .HasVoted}}text-indigo-600 dark:text-indigo-400 bg-indigo-50 dark:bg-indigo-900/30{{else}}text-gray-400 dark:text-gray-500 hover:text-indigo-600 dark:hover:text-indigo-400 hover:bg-gray-50 dark:hover:bg-gray-700{{end}} transition-colors">
        <svg class="h-8 w-8" fill="{{if .HasVoted}}currentColor{{else}}none{{end}}" viewBox="0 0 24 24" stroke="currentColor">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"/>
        </svg>
        <span class="text-lg font-bold mt-1">{{.VoteCount}}</span>
        <span class="text-xs">{{if .HasVoted}}voted{{else}}vote{{end}}</span>
    </button>
</form>
