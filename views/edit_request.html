<div class="max-w-2xl mx-auto">
    <div class="mb-8">
        <a href="/requests/{{.Request.ID}}" class="text-sm text-indigo-600 dark:text-indigo-400 hover:text-indigo-500 flex items-center mb-4">
            <svg class="h-4 w-4 mr-1" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
            </svg>
            Back to Request
        </a>
        <h1 class="text-3xl font-bold text-gray-900 dark:text-white">Edit Request</h1>
        <p class="mt-2 text-gray-600 dark:text-gray-400">Update your request details</p>
    </div>

    <div class="bg-white dark:bg-gray-800 shadow rounded-lg p-6">
        <form hx-post="/requests/{{.Request.ID}}/edit" hx-target="#form-error" hx-swap="innerHTML">
            <div class="space-y-6">
                <div>
                    <label for="title" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Title <span class="text-red-500">*</span>
                    </label>
                    <input type="text" name="title" id="title" required
                           value="{{.Request.Title}}"
                           class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3 border"
                           placeholder="e.g., Redis Cluster with Sentinel">
                    <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">A brief, descriptive title for your request</p>
                </div>

                <div>
                    <label for="type" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Type
                    </label>
                    <select name="type" id="type"
                            class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3 border">
                        <option value="pack" {{if eq .Request.Type "pack"}}selected{{end}}>Pack (templated with variables)</option>
                        <option value="job" {{if eq .Request.Type "job"}}selected{{end}}>Job (single HCL file)</option>
                    </select>
                </div>

                <div>
                    <label for="description" class="block text-sm font-medium text-gray-700 dark:text-gray-300">
                        Description
                    </label>
                    <textarea name="description" id="description" rows="6"
                              class="mt-1 block w-full rounded-md border-gray-300 dark:border-gray-700 dark:bg-gray-900 dark:text-white shadow-sm focus:border-indigo-500 focus:ring-indigo-500 sm:text-sm p-3 border"
                              placeholder="Describe what you're looking for...">{{.Request.Description}}</textarea>
                    <p class="mt-1 text-xs text-gray-500 dark:text-gray-400">Provide details to help contributors understand what you need</p>
                </div>

                <div id="form-error" class="text-sm text-red-600 dark:text-red-400"></div>

                <div class="flex justify-between">
                    <button type="button"
                            hx-delete="/requests/{{.Request.ID}}"
                            hx-confirm="Are you sure you want to delete this request? This cannot be undone."
                            class="px-4 py-2 border border-red-300 dark:border-red-600 rounded-md shadow-sm text-sm font-medium text-red-700 dark:text-red-400 bg-white dark:bg-gray-700 hover:bg-red-50 dark:hover:bg-red-900/20 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-red-500">
                        Delete Request
                    </button>
                    <div class="flex gap-4">
                        <a href="/requests/{{.Request.ID}}" class="px-4 py-2 border border-gray-300 dark:border-gray-600 rounded-md shadow-sm text-sm font-medium text-gray-700 dark:text-gray-300 bg-white dark:bg-gray-700 hover:bg-gray-50 dark:hover:bg-gray-600 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            Cancel
                        </a>
                        <button type="submit" class="px-4 py-2 border border-transparent rounded-md shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500">
                            Save Changes
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </div>
</div>
