name: Weekly Security Scan

on:
  schedule:
    # Run at 2 AM UTC every Monday
    - cron: '0 2 * * 1'
  workflow_dispatch:  # Allow manual trigger

jobs:
  full-security-scan:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'
        check-latest: true

    # Run the analysers at master, not the Makefile pins, so new checks and
    # toolchain breaks surface here first; bump the pins when this passes.
    - name: Install security tools
      run: |
        go install github.com/securego/gosec/v2/cmd/gosec@master
        go install honnef.co/go/tools/cmd/staticcheck@master
        go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run staticcheck at master
      run: |
        staticcheck ./...
        staticcheck -tags=security ./...

    - name: Run gosec with SARIF output
      run: |
        echo "=== Running gosec ==="
        gosec -fmt sarif -out gosec-results.sarif ./... || true
        gosec ./...

    - name: Upload gosec SARIF
      uses: github/codeql-action/upload-sarif@v4
      if: always()
      with:
        sarif_file: gosec-results.sarif
      continue-on-error: true

    - name: Run govulncheck
      run: |
        echo "=== Running govulncheck ==="
        govulncheck ./...

    - name: Run all security tests
      run: |
        echo "=== Running security tests ==="
        go test -tags=security -v ./...

    - name: Run regular tests (full suite)
      run: |
        echo "=== Running full test suite ==="
        go test -v ./...
