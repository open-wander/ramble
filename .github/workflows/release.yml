name: Release and Deploy

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
      publish_unsigned_cli:
        description: 'Emergency only: publish unsigned CLI binaries from GitHub Actions'
        required: true
        type: boolean
        default: false

permissions:
  contents: write
  packages: write
  id-token: write
  attestations: write

jobs:
  bump-version:
    runs-on: ubuntu-latest
    outputs:
      new_version: ${{ steps.bump.outputs.new_version }}
      new_version_num: ${{ steps.bump.outputs.new_version_num }}
      old_version: ${{ steps.bump.outputs.old_version }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Bump version
        id: bump
        run: |
          # The latest git tag is the source of truth for the current version.
          CURRENT_VERSION=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "old_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Remove 'v' prefix for parsing
          VERSION_NUM=${CURRENT_VERSION#v}

          # Split into parts
          IFS='.' read -r MAJOR MINOR PATCH <<< "$VERSION_NUM"

          # Bump based on input
          case "${{ inputs.bump_type }}" in
            major)
              MAJOR=$((MAJOR + 1))
              MINOR=0
              PATCH=0
              ;;
            minor)
              MINOR=$((MINOR + 1))
              PATCH=0
              ;;
            patch)
              PATCH=$((PATCH + 1))
              ;;
          esac

          NEW_VERSION="v${MAJOR}.${MINOR}.${PATCH}"
          NEW_VERSION_NUM="${MAJOR}.${MINOR}.${PATCH}"
          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_version_num=$NEW_VERSION_NUM" >> $GITHUB_OUTPUT
          echo "New version: $NEW_VERSION (docker tag: $NEW_VERSION_NUM)"

          # Create and push only the tag. Branch protection governs branch refs
          # (refs/heads/main), not tags, so this never touches the protected branch.
          git tag -a "$NEW_VERSION" -m "Release $NEW_VERSION"
          git push origin "$NEW_VERSION"

  # Self-hosted runner: no GitHub-hosted minutes, arm64 via binfmt.
  build-and-push:
    needs: bump-version
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump-version.outputs.new_version }}

      - name: Compute build metadata
        id: meta
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push
        id: push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          build-args: |
            VERSION=${{ needs.bump-version.outputs.new_version }}
            COMMIT=${{ steps.meta.outputs.commit }}
            BUILD_DATE=${{ steps.meta.outputs.date }}
          tags: |
            ghcr.io/${{ github.repository }}:${{ needs.bump-version.outputs.new_version_num }}
            ghcr.io/${{ github.repository }}:latest
          labels: |
            org.opencontainers.image.version=${{ needs.bump-version.outputs.new_version }}

      - name: Attest Build Provenance
        uses: actions/attest-build-provenance@v2
        with:
          subject-name: ghcr.io/${{ github.repository }}
          subject-digest: ${{ steps.push.outputs.digest }}
          push-to-registry: true

  # The self-hosted runner can reach the Nomad API; the address, token and
  # datacenter are repo secrets. The job spec in git IS the deployment: the
  # workflow adds only the image tag, as a variable. Nothing is edited on any
  # server.
  deploy:
    needs: [bump-version, build-and-push]
    runs-on: [self-hosted, linux, x64]
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump-version.outputs.new_version }}

      # Pinned Nomad CLI matching the cluster, verified against HashiCorp's
      # published checksums. No third-party action in the deploy path.
      - name: Install nomad
        env:
          NOMAD_VERSION: 2.0.6
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          curl -sSfO "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_linux_amd64.zip"
          curl -sSf "https://releases.hashicorp.com/nomad/${NOMAD_VERSION}/nomad_${NOMAD_VERSION}_SHA256SUMS" \
            | grep " nomad_${NOMAD_VERSION}_linux_amd64.zip\$" | sha256sum -c -
          unzip -oq "nomad_${NOMAD_VERSION}_linux_amd64.zip" nomad
          mkdir -p "$HOME/.local/bin" && mv nomad "$HOME/.local/bin/nomad"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Deploy
        env:
          NOMAD_ADDR: ${{ secrets.NOMAD_ADDR }}
          NOMAD_TOKEN: ${{ secrets.NOMAD_TOKEN }}
          NOMAD_DATACENTER: ${{ secrets.NOMAD_DATACENTER }}
        run: |
          set -euo pipefail
          image="ghcr.io/${GITHUB_REPOSITORY,,}:${{ needs.bump-version.outputs.new_version_num }}"
          echo "deploying $image"
          nomad job run -var "image=$image" -var "datacenters=[\"${NOMAD_DATACENTER}\"]" deploy/nomad/ramble.nomad.hcl

      - name: Verify
        run: |
          sleep 20
          code=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' https://ramble.openwander.org/)
          echo "ramble.openwander.org -> $code"
          [ "$code" = "200" ] || { echo FAILED; exit 1; }
          code=$(curl -s --max-time 15 -o /dev/null -w '%{http_code}' https://rmbl.openwander.org/x)
          echo "rmbl.openwander.org  -> $code (expect 301)"
          [ "$code" = "301" ] || { echo FAILED; exit 1; }

  release:
    needs: [bump-version, build-and-push]
    if: inputs.publish_unsigned_cli
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.bump-version.outputs.new_version }}
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.26.x'
          check-latest: true

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@v6
        with:
          distribution: goreleaser
          version: '~> v2'
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
