name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'
        check-latest: true

    - name: Verify dependencies
      run: go mod verify

    - name: Vet
      run: |
        go vet ./...
        go vet -tags=security ./...

    - name: staticcheck
      run: make staticcheck

    - name: Lint workflows
      run: make actionlint

    - name: Tool pins match between Makefile and Dockerfile
      run: make check-pins

    - name: Check formatting and go fix modernizers
      run: |
        unformatted=$(gofmt -l .)
        if [ -n "$unformatted" ]; then
          echo "gofmt needed on:"; echo "$unformatted"; exit 1
        fi
        # go fix -diff exits non-zero when it has changes; keep going so the diff is printed.
        fixes=$(go fix -diff ./... || true; go fix -tags=security -diff ./... || true)
        if [ -n "$fixes" ]; then
          echo "$fixes"; echo "Run 'go fix ./...' and 'go fix -tags=security ./...' and commit the changes."; exit 1
        fi

    - name: Run tests
      run: go test -tags=security -v ./...

    - name: Check Swagger docs are up to date
      run: |
        make swagger
        if ! git diff --quiet api-docs/; then
          echo "Swagger docs are out of date. Run 'make swagger' and commit the changes."
          git diff api-docs/
          exit 1
        fi

  security-scan:
    runs-on: ubuntu-26.04
    steps:
    - uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.27.x'
        check-latest: true

    # Pinned in the Makefile (GOSEC_VERSION).
    - name: Run gosec
      run: make gosec

    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest

    - name: Run govulncheck
      run: govulncheck ./...
